<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SIF 综合处理 - 后台</title><link rel="stylesheet" href="/static/styles.css"><style>.admin-page{max-width:1400px;margin:28px auto;padding:0 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.admin-head h1{margin:0;font-size:23px}.admin-grid{display:grid;grid-template-columns:1fr 2fr;gap:18px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px}.admin-card h2{font-size:17px;margin:0 0 14px}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}}</style></head>
<body>
  <main class="admin-page">
    <div class="admin-head"><div><h1>后台管理</h1><div id="user" class="muted"></div></div><div class="history-actions"><a class="plain-link" href="/">工作台</a><button class="secondary-button" id="logout">退出</button></div></div>
    <div class="admin-grid"><section class="admin-card"><h2>用户管理</h2><div class="table-wrap"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="admin-card"><h2>请求记录</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>用户</th><th>方法</th><th>路径</th><th>状态</th><th>IP</th></tr></thead><tbody id="requests"></tbody></table></div></section></div>
  </main>
  <script>
    const token=localStorage.getItem('sif_token')||'';const headers={Authorization:'Bearer '+token};const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){const me=await fetch('/api/auth/me',{headers});if(!me.ok)return location.href='/static/auth.html';const md=await me.json();if(md.user.role!=='admin')return location.href='/';document.getElementById('user').textContent='管理员：'+md.user.username;const results=await Promise.all([fetch('/api/admin/users',{headers}),fetch('/api/admin/requests',{headers})]);const users=await results[0].json(),requests=await results[1].json();document.getElementById('users').innerHTML=users.data.map(user=>'<tr><td>'+esc(user.username)+'</td><td>'+user.role+'</td><td>'+user.status+'</td><td>'+(user.role==='admin'?'当前管理员':'<button class="secondary-button user-action" data-id="'+user.id+'" data-action="'+(user.status==='active'?'disable':'enable')+'">'+(user.status==='active'?'禁用':'启用')+'</button> <button class="secondary-button reset-action" data-id="'+user.id+'">重置密码</button>')+'</td></tr>').join('');document.getElementById('requests').innerHTML=requests.data.map(item=>'<tr><td>'+esc(item.created_at)+'</td><td>'+esc(item.username||'匿名')+'</td><td>'+esc(item.method)+'</td><td>'+esc(item.path)+'</td><td>'+item.status_code+'</td><td>'+esc(item.ip_address)+'</td></tr>').join('')||'<tr><td colspan="6" class="muted">暂无请求</td></tr>';}
    document.addEventListener('click',async event=>{if(event.target.classList.contains('user-action')){await fetch('/api/admin/users/'+event.target.dataset.id,{method:'PATCH',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({action:event.target.dataset.action,user_id:Number(event.target.dataset.id)})});load();}if(event.target.classList.contains('reset-action')){const password=prompt('请输入新密码（至少6位）');if(password)await fetch('/api/admin/users/'+event.target.dataset.id,{method:'PATCH',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({action:'reset_password',user_id:Number(event.target.dataset.id),password})});load();}});document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers});localStorage.removeItem('sif_token');location.href='/static/auth.html';};load();
  </script>
</body>
</html>
